name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check version metadata
        run: npm run check:version

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run CLI tests (unit + e2e)
        run: npm run test:cli

      # Deterministic engine evals only — the agent suite costs tokens and is run manually.
      - name: Run engine evals
        run: npm run eval:engine

      # The hard dataset's engine suite is equally deterministic, and it also guards the
      # glossary -> term-resolution chain that the agent A/B depends on.
      - name: Run engine evals (hard dataset)
        run: npm run eval:engine:hard
